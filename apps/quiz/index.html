<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eaf0ec">
    <title>人格与思维方式综合评估</title>
    <meta name="description" content="一份由 10 道题组成的娱乐问答测试。">
    <link rel="stylesheet" href="styles.css">
    <script src="quiz.js" defer></script>
  </head>
  <body>
    <main class="quiz-shell">
      <section class="quiz-card" data-view="welcome">
        <p class="eyebrow">PERSONAL PATTERN REVIEW</p>
        <h1>人格与思维方式综合评估</h1>
        <p class="intro">通过 10 个日常问题，观察你的决策方式与思考偏好。</p>
        <button type="button" data-start>开始测试</button>
      </section>

      <section class="quiz-card" data-view="question" hidden>
        <header class="progress-header">
          <span data-progress>第 1 题，共 10 题</span>
          <progress data-progress-bar max="10" value="1">1/10</progress>
        </header>
        <form data-question-form>
          <fieldset>
            <legend data-prompt></legend>
            <div class="option-list" data-options></div>
          </fieldset>
          <button type="submit" data-next disabled>下一题</button>
        </form>
      </section>

      <section class="quiz-card analysis-card" data-view="analysis" hidden aria-live="polite">
        <div class="analysis-mark" aria-hidden="true"></div>
        <h2>正在整理你的思维图谱</h2>
        <p>交叉比对选择偏好与决策模式……</p>
      </section>

      <section class="quiz-card result-card" data-view="result" hidden>
        <p class="eyebrow">ASSESSMENT COMPLETE</p>
        <h2 data-result-title>测试结果</h2>
        <p class="result-value" data-result-value>你是 gay</p>
        <p class="disclaimer" data-disclaimer>纯属娱乐，本测试不能判断任何人的性取向</p>
        <div class="result-actions">
          <button type="button" data-restart>再测一次</button>
          <button type="button" class="secondary" data-copy>复制结果</button>
        </div>
      </section>

      <p class="status" data-status aria-live="polite"></p>
      <noscript>需要启用 JavaScript 才能进行测试。</noscript>
    </main>
  </body>
</html>
